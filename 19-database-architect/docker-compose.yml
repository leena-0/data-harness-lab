services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-password
      POSTGRES_DB: shop_lab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d shop_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - shop-lab-data:/var/lib/postgresql/data

volumes:
  shop-lab-data:
